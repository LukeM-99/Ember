# mpd.conf: per-user MPD, started by ember (or `mpd`), no system service.
music_directory    "~/Music"
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.local/share/mpd/database"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"
bind_to_address    "~/.local/share/mpd/socket"
auto_update        "yes"
restore_paused     "yes"

audio_output {
  type "pulse"
  name "pulse"
}

decoder {
  plugin  "wildmidi"  # needs timidity's config; off so MPD doesn't warn at every start
  enabled "no"
}
